seed: 42

# Single-class data source settings
class_idx: 153
step_idx: 6
layer_idx: 16
normalize_rewards: true

split_ratio: [0.9, 0.1]
batch_size: 128
num_workers: 4

# Model
# input_dim_candidate: 1152  # optional; if unset, use dataset hidden_dim automatically
hidden_dim: 256
num_layers: 4
dropout: 0.1
half: true

# Optimizer
optimizer: adamw
lr: 1e-4
weight_decay: 1e-4
beta1: 0.9
beta2: 0.999
eps: 1e-8
momentum: 0.9

# LR scheduler
scheduler: cosine
T_max: 100
eta_min: 0.0

# Training objective
parallel_size: 8
num_bootstrap: 8

num_epochs: 100
save_interval: 1
eval_interval: 1

output_dir: /root/autodl-tmp/ranker_ckpts/single_class
run_name: single_class_ranker
