# ImageNet class-conditional ranker (DiffusionRanker_Transformer)
# Run from repo root or class_condition:
#   python -m class_condition.train_ranker
#   python class_condition/train_ranker.py
# Overrides:  python train_ranker.py hs_reward_path=/path/to.pt lr=3e-4

seed: 42

# Rollout .pt from dit_rollout_is_imagenet.py (must match step/layer below)
hs_reward_path: /root/autodl-tmp/dit_imagenet_hiddens_and_is_rewards_s1_6_9_l16_per128_s6_l16.pt

# Align with keys in saved rollout meta / RankerDataset
step_idx: 9
layer_idx: 16

# null => no external prompt table (zeros); or one_hot|clip|bert|llm_tokenizer|llm_hidden_state
prompt_type: bert # none, bert, one_hot, clip, llm_tokenizer, llm_hidden_state ; null: 1000, one_hot: 1000, clip: 768, bert: 1024, llm_tokenizer: 10, llm_hidden_state: 3584

# shuffle_class: false
split_ratio: [0.9, 0.1]
batch_size: 32
num_workers: 4

# Ranker (DiT-XL/2 hidden dim after seq pool is typically 1152)
input_dim_candidate: 1152
input_dim_prompt: 1024 # prompt_type=bert uses prompt dim 1024
hidden_dim: 64
num_heads: 8
dropout: 0.1
num_layers: 2
half: true

optimizer: adamw
lr: 1e-4
weight_decay: 0.0001
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
momentum: 0.9

scheduler: cosine
T_max: 100
eta_min: 0.0
start_factor: 0.01
end_factor: 0.1
total_iters: 100
step_size: 10
gamma: 0.1

alpha: 0.1
kl_type: kl
ranker_type: listwise
criterion: null

parallel_size: 8
num_bootstrap: 32

num_epochs: 100
save_interval: 1
eval_interval: 1
output_dir: /root/autodl-tmp/ranker_ckpts
run_name: imagenet_dit_is_listwise
